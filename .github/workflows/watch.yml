name: ACCT Kitten Watcher

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-cats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright requests pillow
          playwright install chromium --with-deps

      - name: Run watcher
        run: python watcher.py

      - name: Save updated state
        run: |
          git config user.name "kitten-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_cats.json
          git diff --staged --quiet || (git commit -m "Update seen kittens" && git push)
